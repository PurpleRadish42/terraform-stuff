<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-label="Architecture: Terraform calls the emulated AWS API in floci, which creates a load balancer, target group, launch configuration and an Auto Scaling group of two EC2 web servers. Requests go from the browser through the load balancer and target group to the instances in turn.">
<title>Architecture: Terraform calls the emulated AWS API in floci, which creates a load balancer, target group, launch configuration and an Auto Scaling group of two EC2 web servers. Requests go from the browser through the load balancer and target group to the instances in turn.</title>
<defs><marker id="m-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L7.5 4L0 7.5z" fill="#58a6ff"/></marker><marker id="m-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L7.5 4L0 7.5z" fill="#bc8cff"/></marker><marker id="m-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L7.5 4L0 7.5z" fill="#6e7681"/></marker></defs>
<rect x="0.5" y="0.5" width="839" height="419" rx="10" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<rect x="224" y="30" width="592" height="340" rx="12" fill="#0f141b" stroke="#30363d" stroke-dasharray="5 5"/>
<text x="240" y="54" fill="#8b949e" font-size="12" font-weight="600">floci: local AWS emulator running in Docker</text>
<text x="800" y="54" fill="#6e7681" font-size="11" text-anchor="end">ap-south-1, default VPC</text>
<rect x="632" y="170" width="168" height="180" rx="10" fill="none" stroke="#3fb950" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text x="716" y="189" fill="#3fb950" font-size="11.5" font-weight="600" text-anchor="middle">Auto Scaling group</text>
<text x="716" y="339" fill="#8b949e" font-size="10.5" text-anchor="middle">min 2, max 10</text>

<path d="M184 100H248" fill="none" stroke="#bc8cff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-purple)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<path d="M398 100H438" fill="none" stroke="#bc8cff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-purple)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<path d="M598 100H716V170" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="8 6" marker-end="url(#m-grey)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.1s" repeatCount="indefinite"/></path>
<text x="726" y="140" fill="#6e7681" font-size="10.5">boot config</text>
<path d="M184 280H248" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-blue)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<path d="M398 280H438" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-blue)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<path d="M598 280H622V226H646" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-blue)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<path d="M598 280H622V292H646" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#m-blue)"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.7s" repeatCount="indefinite"/></path>
<text x="190" y="271" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5">:80</text>
<g opacity="0"><animateMotion path="M184 280H622V226H646" dur="5s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.44;1" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.44" dur="5s" calcMode="discrete" repeatCount="indefinite"/><circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/></g>
<g opacity="0"><animateMotion path="M184 280H622V292H646" dur="5s" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.94;1" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.94" dur="5s" calcMode="discrete" repeatCount="indefinite"/><circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/></g>

<rect x="24" y="70" width="160" height="60" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.2"/><text x="38" y="97.0" fill="#e6edf3" font-size="13" font-weight="600">Terraform</text><text x="38" y="115.0" fill="#8b949e" font-size="11">main.tf, provider.tf</text>
<rect x="24" y="250" width="160" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="38" y="277.0" fill="#e6edf3" font-size="13" font-weight="600">Browser / curl</text><text x="38" y="295.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5">http://&lt;alb_dns_name&gt;/</text>
<rect x="248" y="70" width="150" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="262" y="97.0" fill="#e6edf3" font-size="13" font-weight="600">AWS API</text><text x="262" y="115.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5">localhost:4566</text>
<rect x="438" y="70" width="160" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="452" y="97.0" fill="#e6edf3" font-size="13" font-weight="600">Launch configuration</text><text x="452" y="115.0" fill="#8b949e" font-size="11">t2.micro + user_data</text>
<rect x="248" y="250" width="150" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="262" y="277.0" fill="#e6edf3" font-size="13" font-weight="600">Load balancer</text><text x="262" y="295.0" fill="#8b949e" font-size="11">listener on :80</text>
<rect x="438" y="250" width="160" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="452" y="277.0" fill="#e6edf3" font-size="13" font-weight="600">Target group</text><text x="452" y="295.0" fill="#8b949e" font-size="11">health check: GET /</text>
<rect x="646" y="200" width="140" height="52" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="660" y="223.0" fill="#e6edf3" font-size="13" font-weight="600">EC2 instance</text><text x="660" y="241.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5">http.server :8080</text>
<rect x="646" y="266" width="140" height="52" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="660" y="289.0" fill="#e6edf3" font-size="13" font-weight="600">EC2 instance</text><text x="660" y="307.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5">http.server :8080</text>
<circle cx="770" cy="216" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="770" cy="282" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/></circle>

<g font-size="11" fill="#8b949e">
<path d="M24 396H52" stroke="#bc8cff" stroke-width="1.6" stroke-dasharray="8 6"/><text x="60" y="400">Terraform creating resources</text>
<path d="M250 396H278" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="8 6"/><text x="286" y="400">HTTP request, alternating between instances</text>
<circle cx="566" cy="396" r="4" fill="#3fb950"/><text x="578" y="400">passing health checks</text>
</g>
</g>
</svg>
